<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Keyboard Piano_Aladdin</title>

  <!-- Step 1: the stylesheet is linked in the <head> -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">

    <header class="intro">
      <h1>My Keyboard Piano</h1>
      <p class="subtitle">
        Press <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd>
        <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd> to play.
        Sharps live on <kbd>W</kbd> <kbd>E</kbd> <kbd>T</kbd> <kbd>Y</kbd> <kbd>U</kbd>.
      </p>
    </header>

    <!-- Bonus: "Show last note" display (updated by script.js) -->
    <section class="display" aria-live="polite">
      <div id="last-note" class="last-note">Do&nbsp;Re&nbsp;Mi</div>
      <p id="status" class="status">Press a key to begin. The page is listening.</p>
    </section>

    <!-- Bonus: sound selector + song mode -->
    <section class="controls">
      <label class="control">
        Sound
        <select id="wave-select">
          <option value="sine">Sine (soft)</option>
          <option value="triangle">Triangle (flute)</option>
          <option value="square">Square (retro game)</option>
          <option value="sawtooth">Sawtooth (buzzy)</option>
        </select>
      </label>

      <label class="control">
        Song mode
        <select id="song-select">
          <option value="">Free play</option>
          <option value="twinkle">Twinkle Twinkle Little Star</option>
          <option value="mary">Mary Had a Little Lamb</option>
          <option value="ode">Ode to Joy</option>
        </select>
      </label>
    </section>

    <!-- Bonus: song letters appear here when a song is chosen -->
    <div id="song-sheet" class="song-sheet" hidden></div>

    <!--
      Step 2: one .piano box holds 8 .key boxes.
      Each key remembers its letter in a data-key attribute.
      --hue gives every key its own glow colour when it is active.
    -->
    <div class="piano" id="piano">

      <div class="key" data-key="a" style="--hue: 350">
        <span class="note-name">C</span>
        <span class="solfege">Do</span>
        <kbd>A</kbd>
      </div>
      <div class="key" data-key="s" style="--hue: 22">
        <span class="note-name">D</span>
        <span class="solfege">Re</span>
        <kbd>S</kbd>
      </div>
      <div class="key" data-key="d" style="--hue: 45">
        <span class="note-name">E</span>
        <span class="solfege">Mi</span>
        <kbd>D</kbd>
      </div>
      <div class="key" data-key="f" style="--hue: 130">
        <span class="note-name">F</span>
        <span class="solfege">Fa</span>
        <kbd>F</kbd>
      </div>
      <div class="key" data-key="g" style="--hue: 172">
        <span class="note-name">G</span>
        <span class="solfege">Sol</span>
        <kbd>G</kbd>
      </div>
      <div class="key" data-key="h" style="--hue: 205">
        <span class="note-name">A</span>
        <span class="solfege">La</span>
        <kbd>H</kbd>
      </div>
      <div class="key" data-key="j" style="--hue: 255">
        <span class="note-name">B</span>
        <span class="solfege">Ti</span>
        <kbd>J</kbd>
      </div>
      <div class="key" data-key="k" style="--hue: 300">
        <span class="note-name">C</span>
        <span class="solfege">Do</span>
        <kbd>K</kbd>
      </div>

      <!-- Bonus: black keys. --i says which gap between white keys they sit on. -->
      <div class="black-key" data-key="w" style="--i: 0; --hue: 8">
        <span>C#</span><kbd>W</kbd>
      </div>
      <div class="black-key" data-key="e" style="--i: 1; --hue: 35">
        <span>D#</span><kbd>E</kbd>
      </div>
      <div class="black-key" data-key="t" style="--i: 3; --hue: 150">
        <span>F#</span><kbd>T</kbd>
      </div>
      <div class="black-key" data-key="y" style="--i: 4; --hue: 190">
        <span>G#</span><kbd>Y</kbd>
      </div>
      <div class="black-key" data-key="u" style="--i: 5; --hue: 280">
        <span>A#</span><kbd>U</kbd>
      </div>

    </div>

    <p class="footnote">Tip: the browser needs one key press or click before it will make sound.</p>
  </main>

  <!-- Step 1: the script is linked at the bottom of the <body>,
       so all the keys exist before JavaScript looks for them. -->
  <script src="script.js"></script>
</body>
</html>
